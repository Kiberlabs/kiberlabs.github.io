<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KiberLabs Animated Emblem</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #060a1f;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "Inter", "Segoe UI", Arial, sans-serif;
  }
  .container {
    position: relative;
    width: 800px;
    height: 800px;
    flex-shrink: 0;
    transform-origin: center center;
    background: radial-gradient(ellipse at center, #0d1b3e 0%, #060a1f 100%);
    overflow: hidden;
  }

  .diagonal {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 180px,
      rgba(30, 80, 160, 0.08) 180px,
      rgba(30, 80, 160, 0.08) 182px
    );
    animation: moveDiagonals 8s linear infinite;
  }
  .diagonal2 {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 250px,
      rgba(20, 60, 140, 0.06) 250px,
      rgba(20, 60, 140, 0.06) 252px
    );
    animation: moveDiagonals2 12s linear infinite;
  }
  @keyframes moveDiagonals {
    0% { transform: translate(0, 0); }
    100% { transform: translate(182px, 182px); }
  }
  @keyframes moveDiagonals2 {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-252px, 252px); }
  }

  .glow-bg {
    position: absolute;
    width: 400px;
    height: 400px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    background: radial-gradient(circle, rgba(0, 150, 255, 0.15) 0%, transparent 70%);
    animation: pulseGlow 3s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -60%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .diagonal, .diagonal2, .glow-bg {
      animation: none !important;
    }
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .text-container {
    position: absolute;
    bottom: 120px;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .title {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .title .kiber { color: #ffffff; }
  .title .labs {
    color: #00bfff;
    text-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
  }
  .subtitle {
    color: #a0c4e8;
    font-size: 22px;
    letter-spacing: 8px;
    margin-top: 10px;
    font-weight: 300;
  }
</style>
</head>
<body>
<div class="container" id="stage">
  <div class="diagonal"></div>
  <div class="diagonal2"></div>
  <div class="glow-bg"></div>
  <canvas id="canvas" width="800" height="800"></canvas>
  <div class="text-container">
    <div class="title"><span class="kiber">Kiber</span><span class="labs">Labs</span></div>
    <div class="subtitle">BUILD &bull; AUTOMATE &bull; SCALE</div>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
function fitStage() {
  const scale = Math.min(window.innerWidth / 800, window.innerHeight / 800);
  stage.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fitStage);
fitStage();

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 800;
const cx = 400, cy = 340;

const particles = [];
for (let i = 0; i < 20; i++) {
  particles.push({
    x: cx + (Math.random() - 0.5) * 60,
    y: cy - 120 + Math.random() * 30,
    size: 8 + Math.random() * 12,
    speedY: -0.5 - Math.random() * 1.5,
    speedX: (Math.random() - 0.5) * 0.8,
    opacity: 0.3 + Math.random() * 0.7,
    color: Math.random() > 0.5 ? '#00e5ff' : '#0099ff'
  });
}

const bubbles = [];
for (let i = 0; i < 15; i++) {
  bubbles.push({
    x: cx + (Math.random() - 0.5) * 100,
    y: cy + 80 + Math.random() * 60,
    radius: 3 + Math.random() * 8,
    speedY: -0.3 - Math.random() * 0.8,
    opacity: 0.2 + Math.random() * 0.4
  });
}

let wheelAngle = 0;
let time = 0;

function drawFlask() {
  ctx.save();
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 25;

  ctx.beginPath();
  ctx.moveTo(cx - 30, cy - 130);
  ctx.lineTo(cx - 30, cy - 90);
  ctx.bezierCurveTo(cx - 30, cy - 60, cx - 110, cy + 20, cx - 110, cy + 100);
  ctx.lineTo(cx + 110, cy + 100);
  ctx.bezierCurveTo(cx + 110, cy + 20, cx + 30, cy - 60, cx + 30, cy - 90);
  ctx.lineTo(cx + 30, cy - 130);
  ctx.closePath();

  const grad = ctx.createLinearGradient(cx, cy - 130, cx, cy + 100);
  grad.addColorStop(0, 'rgba(0, 100, 200, 0.1)');
  grad.addColorStop(0.6, 'rgba(0, 150, 255, 0.25)');
  grad.addColorStop(1, 'rgba(0, 200, 255, 0.4)');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.restore();
}

function drawWheel() {
  ctx.save();
  ctx.translate(cx, cy + 10);
  ctx.rotate(wheelAngle);

  const r = 45;
  const spokes = 8;

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 5;
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 10;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2);
  ctx.lineWidth = 4;
  ctx.stroke();

  for (let i = 0; i < spokes; i++) {
    const angle = (i / spokes) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * r * 0.35, Math.sin(angle) * r * 0.35);
    ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#00e5ff';
  ctx.fill();
  ctx.restore();
}

function drawParticles(step) {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.restore();

    if (!step) return;
    p.y += p.speedY;
    p.x += p.speedX;
    p.opacity -= 0.003;

    if (p.y < cy - 200 || p.opacity <= 0) {
      p.y = cy - 120 + Math.random() * 20;
      p.x = cx + (Math.random() - 0.5) * 50;
      p.opacity = 0.5 + Math.random() * 0.5;
      p.size = 8 + Math.random() * 12;
    }
  });
}

function drawBubbles(step) {
  bubbles.forEach(b => {
    ctx.save();
    ctx.globalAlpha = b.opacity;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 200, 255, 0.3)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 220, 255, 0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    if (!step) return;
    b.y += b.speedY;
    b.x += Math.sin(time * 0.02 + b.radius) * 0.3;

    if (b.y < cy - 50) {
      b.y = cy + 80 + Math.random() * 60;
      b.x = cx + (Math.random() - 0.5) * 100;
      b.radius = 3 + Math.random() * 8;
      b.opacity = 0.2 + Math.random() * 0.4;
    }
  });
}

function drawLiquid() {
  ctx.save();
  ctx.beginPath();
  const liquidTop = cy + 20 + Math.sin(time * 0.05) * 5;
  ctx.moveTo(cx - 95, cy + 100);
  ctx.lineTo(cx + 95, cy + 100);
  ctx.bezierCurveTo(cx + 95, cy + 20, cx + 25, cy - 50, cx + 25, cy - 80);
  ctx.lineTo(cx - 25, cy - 80);
  ctx.bezierCurveTo(cx - 25, cy - 50, cx - 95, cy + 20, cx - 95, cy + 100);
  ctx.closePath();

  const grad = ctx.createLinearGradient(cx, liquidTop, cx, cy + 100);
  grad.addColorStop(0, 'rgba(0, 150, 255, 0.15)');
  grad.addColorStop(1, 'rgba(0, 100, 200, 0.35)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
}

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

function renderFrame(step) {
  ctx.clearRect(0, 0, W, H);
  if (step) {
    time++;
    wheelAngle += 0.015;
  }
  drawLiquid();
  drawFlask();
  drawBubbles(step);
  drawWheel();
  drawParticles(step);
}

function animate() {
  if (reducedMotion.matches) {
    renderFrame(false);
    return;
  }
  renderFrame(true);
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
